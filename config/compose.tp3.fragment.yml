# Merge this fragment into the actual vLLM service. It only documents the variables
# that must cross the Compose boundary; it is not a standalone serving definition.
services:
  vllm-dspark:
    network_mode: host
    ipc: host
    environment:
      TP_SIZE: "${TP_SIZE:-3}"
      PP_SIZE: "${PP_SIZE:-1}"
      NNODES: "${NNODES:-3}"
      NODE_RANK: "${NODE_RANK}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-29500}"
      MOE_BACKEND: "${MOE_BACKEND:-flashinfer_b12x}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-460800}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-16}"
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.85}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-5}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_SUBNET_AWARE_ROUTING: "${NCCL_IB_SUBNET_AWARE_ROUTING:-1}"
      NCCL_NET_PLUGIN: "${NCCL_NET_PLUGIN:-none}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"
      NCCL_IB_ADDR_FAMILY: "${NCCL_IB_ADDR_FAMILY:-AF_INET}"
      NCCL_IB_ROCE_VERSION_NUM: "${NCCL_IB_ROCE_VERSION_NUM:-2}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_DEBUG_SUBSYS: "${NCCL_DEBUG_SUBSYS:-INIT,NET,GRAPH}"
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
