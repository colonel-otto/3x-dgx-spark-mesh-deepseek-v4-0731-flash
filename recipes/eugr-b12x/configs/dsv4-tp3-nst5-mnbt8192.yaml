# Recipe: DeepSeek V4 Flash 0731 — LOCAL checkpoint, 3-node TP=3
# Engine A/B arm for colonel-otto/3x-dgx-spark-mesh-deepseek-v4-0731-flash
# (docs/ENGINE-AB-3NODE.md). Derived from deepseek-v4-flash-0731.yaml with:
#   - model served from the local snapshot (mount -v /tmp/dsv4:/models/dsv4host)
#   - tensor_parallel 3 (image's b12x virtual-TP pads 64->72 heads, 8->9 groups)
#   - max_num_seqs 16 to match the tp3-seqs16 reference config
# Deltas vs our anemll engine to record with any measurement:
#   kv-cache-dtype fp8 (ours: nvfp4_ds_mla), speculative dspark nst=5
#   probabilistic (ours: MTP K=2). /tmp/dsv4 symlinks vanish on reboot —
#   recreate with: ln -sfn $HOME/dsv4 /tmp/dsv4 on EVERY node.

recipe_version: "1"
name: DSV4-Flash-0731-local-TP3-nst5-mnbt8192
description: Engine A/B arm — local 0731 snapshot on 3x DGX Spark, TP=3

model: /models/dsv4host/hf-DeepSeek-V4-Flash-0731
container: vllm-node-b12x

build_args:
  - --exp-b12x

cluster_only: true

mods:
  - mods/instanttensor-hybrid-draft-loader

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 3
  gpu_memory_utilization: 0.85
  max_model_len: auto
  block_size: 256
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 5

env:
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_MOE_SKIP_PADDING: "0"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve /models/dsv4host/hf-DeepSeek-V4-Flash-0731 \
      --served-model-name deepseek-v4-flash-dspark-abliterated deepseek-v4-flash-eugr-ab \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'
