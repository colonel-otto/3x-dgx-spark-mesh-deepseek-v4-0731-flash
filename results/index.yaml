    reps: 5 trials per cell per sweep point; the nst=5 c=1 cell re-measured with 7 trials after the JIT counter froze
    reps_verified: true
    statistic: median-of-trials per bench-miaai
    fabric_gate: PRESENT-PASS
    fabric_gate_artifact: nst5-mnbt8192/fabric-gate-preboot.json
    fabric_gate_evidence: >
      Full gate run with the engine DOWN (the only window in which the NCCL
      collective bandwidth check can run): 30 passed, 0 failed, all three pairs
