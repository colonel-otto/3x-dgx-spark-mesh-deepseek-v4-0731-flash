# Provenance index for results/
#
# One entry per directory under results/. Every published number should be
# traceable through this file to a committed raw-data file.
#
# Generated 2026-08-26 by auditing each directory's committed artifacts.
# Updated 2026-08-27 for the corrected decode and quality-suite bundles.
# Adversarially re-verified 2026-08-27: every row's node count,
# TP size, rep count and completion-token distribution was independently
# re-derived from the raw files rather than accepted from the first pass.
# Fields marked "from-raw" were read out of the raw data, NOT from the README.
#
# STATUS VALUES
#   VOID-degraded-fabric   measured before 2026-08-25; one node ran at ~15% of
#                          its collective bandwidth with every indicator green
#                          (issue #14). Conclusions may survive; magnitudes do not.
#   VOID-25-token-window   decode measured over a ~25-token completion window
#                          instead of the requested 256 (issue #26). Verified by
#                          grepping completion_tokens in the raw data per directory.
#   VOID-incomplete-run    an attempted run produced no valid measured samples.
#   SUPERSEDED-BY-<dir>    a later run replaced it.
#   CURRENT                healthy fabric AND sound methodology.
#
# A directory may qualify on several grounds; `void_reasons` lists all of them
# and `status` carries the most severe.
#
# VOID IS NOT DELETE
#   VOID rows are retained deliberately, as diagnostic baselines. Every VOID row
#   carries a `baseline_value` field answering one question: "if someone
#   reproducing this work gets numbers like these, what does it tell them?"
#   A voided number is still a fingerprint of a specific failure, and matching
#   that fingerprint is often the fastest way to identify the failure.
#
# FABRIC GATE PROVENANCE  (`fabric_gate`)
#   This repo lost multiple benchmark rounds to a fabric fault that no indicator
#   caught: a node ran at ~15% of its collective bandwidth with every counter
#   green (issue #14). scripts/fabric_gate.sh exists to catch that, and
#   scripts/run_experiment.sh calls it and refuses to benchmark on failure.
#   A result with no committed gate artifact is NOT automatically void, but its
#   fabric state is an assumption rather than a measurement, and it is marked so.
#
#   PRESENT-PASS     a gate artifact is committed in this directory and it passed
#   PRESENT-FAIL     a gate artifact is committed and it failed
#   ABSENT           no gate artifact committed; fabric state is unverified here
#   PRE-DATES-GATE   run predates scripts/fabric_gate.sh; no gate could exist
#
#   `fabric_gate_evidence` records what the artifact actually says, and
#   `fabric_gate_note` records why a row is ABSENT when it claims to be gated.

