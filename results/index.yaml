    fabric_gated: false
    fabric_state: degraded
    raw_data_committed: true
    raw_files: [benchmark.jsonl]
    status: VOID-degraded-fabric
    void_reasons:
      - VOID-degraded-fabric
      - VOID-25-token-window   # 10-token window, worse than 25
    superseded_by: null
    baseline_value: >
      KEPT AS A DIAGNOSTIC BASELINE. This row fingerprints TWO failures at once.
      (1) If your TP=2 single-stream decode sits around 44-52 tok/s where a
      healthy 2-node arm measures ~76 tok/s aggregate at cc=1, suspect a
      degraded fabric link and run scripts/fabric_gate.sh with the engine
      STOPPED -- bandwidth is only measurable when nothing else holds the NICs.
      (2) If your per-request completion_tokens come back as a small constant
      (10 here, 25-26 in the depth sweep) regardless of the max_tokens you
      asked for, your prompt is letting the model stop early and your decode
      rate is measuring startup overhead, not steady-state decode. Assert
      completion_tokens == max_tokens per request, set min_tokens == max_tokens
      and ignore_eos, and re-run. A 10-token window also cannot average MTP
      speculative-decode acceptance at all, so any tok/s from it is noise even
      before the fabric is considered.
    traceability_warning: >
      The published headline 48.23 tok/s does NOT appear in benchmark.jsonl.
      The nine cc=1 decode_tps values are 44.31, 50.69, 50.86, 51.24, 51.48,
      53.61, 56.53, 65.33, 66.32 (median 51.48). See INDEX.md step-4 list.

