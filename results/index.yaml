    baseline_value: >
      KEPT AS A DIAGNOSTIC BASELINE for anyone attempting expert parallelism on
      this stack. If you configure EP=3 (TP=1/DP=3) on a B12X MoE backend and
      your per-stream decode collapses to roughly a third of your TP baseline
      -- committed here as per_stream_tok_s 17.23 / 12.34 / 11.95 / 8.65 across
      cc=1/4/8/16 -- you are not looking at a misconfiguration you can tune out
      and you are not looking at a node-count penalty. The B12X MoE kernel does
      not take the EP path. The 256 experts DO shard 86/85/85 and KV pool does
      grow ~2.3x, so the config "works" and will mislead you. Stop tuning and
      change parallelism strategy. The MAGNITUDES here were measured on the
      degraded fabric and must not be quoted; the ~2.5x-slower DIRECTION is a
      kernel behaviour and is not fabric-sensitive.
    conclusion_survives: >
      The qualitative finding (B12X MoE kernel refuses EP; ~2.5x slower) is a
      hard behavioural result, not a magnitude, and is not disturbed by fabric.

