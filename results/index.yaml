  - dir: 20260831T0030Z-eugr-remaining-cells
    date: 2026-08-31
    description: >
      The three A/B cells left open by the K sweep, on the eugr engine at the
      sweep-winning nst=5/mnbt=8192. PROMPT EFFECT: code-brief 89.4 tok/s vs
      dense-prose 45.9 = 1.95x on identical hardware minutes apart (anemll
      recorded 1.65x) - the DSpark/MTP acceptance effect is LARGER on this
      engine, so no decode number means anything without its prompt shape.
      CAVEAT: ours-bench.py was never committed and no doc records the
      dense-prose prompt text, so the prompt here is a RECONSTRUCTION to the
      recorded ~51-token shape; the cross-engine dense-prose number is NOT
      matched and only the within-engine ratio is sound. The code-brief prompt
      IS exact (recovered verbatim from the committed bench_tp3.py default, 18
      tokens, matching the anemll rows). 131K DECODE: 42.3 tok/s cold vs anemll
      83.5, but NOT a matched config - anemll ran max_model_len 460800 and this
      engine serves 1048576 - and prefill is 2.6x FASTER (TTFT 53,721ms vs
      138,076ms), so it is slower at decode AFTER a long prefill, not at long
      context generally. A first attempt reusing one 131K prompt was DISCARDED:
      TTFT fell 58,742ms -> 1,262ms between reps, i.e. the prefix cache served
      the later reps; the harness now builds a unique 131K prompt per rep and
      every rep shows a cold 53-56s TTFT. DEEP CONCURRENCY 4x200K: 1.4 tok/s
      aggregate, median TTFT 226.6s, 0 errors (anemll 0.9) - completes but
      remains unusable; a workload-shape limit, not an engine defect.
    has_readme: true
    nodes: 3
    nodes_evidence: >
      Run against the eugr.service endpoint on :8100 while the unit was active
      at nst=5/mnbt=8192; the fabric gate artifacts enumerate all three nodes.
