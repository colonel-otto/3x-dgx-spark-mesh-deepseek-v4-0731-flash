      KEPT AS A CONFIGURATION BASELINE, not a performance one -- there is no
      benchmark output in this directory at all. Its value is the TP=3 rank env
      itself, which documents the o_groups padding patch that TP=3 requires on
      this image: stock vLLM rejects 64 heads / TP=3, and if you bypass only
      that validation then n_local_groups = 8 // 3 == 2, which represents 6
      global groups and silently LOSES 2 -- the server starts, serves, and
      returns fluent nonsense with no error. If you are running TP=3 and your
      outputs are grammatical but wrong, check this before you check anything
      else, and verify the patch pads the GROUP count while holding
      heads_per_group at 8 so the o_proj BMM r dim stays 4096 to match
      wo_a=[8192,4096]. Also note the two published TP=3 figures from this era
      (53.95-57.73 tok/s) trace to NO file under results/ -- do not treat them
      as a target to reproduce.

