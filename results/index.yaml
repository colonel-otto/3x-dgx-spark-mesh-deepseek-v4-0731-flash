      are committed under crash/), do NOT conclude that seqs=32 is unstable on
      this hardware. That is the conclusion recorded here and it is FALSIFIED:
      the same change on healthy fabric is stable and gives +46.3% aggregate at
      cc=32 (see 20260826-seqs32-retest). The real signal is in the bandwidth
      numbers alongside the crash -- a 3-rank collective budget of 0.49 GB/s
      against 3.25+ GB/s healthy, a 6.6x shortfall. Raising concurrency raises
      collective traffic; a degraded link that merely slows a light workload
      will TIME OUT a heavy one. So: an allgather timeout that appears only
      when you increase concurrency is a fabric symptom presenting as a config
      failure. Gate the fabric before you roll back the config, and beware that
      having bandwidth data is not the same as having a threshold that stops
      the run.
    superseded_note: >
      The rejection recorded here is falsified. It was made against a 3-rank
      collective budget of 0.49 GB/s (degraded); the retest on healthy fabric
      shows seqs=32 stable and +46.3% at cc=32 (issue #10).

