    measurement. Three newly imported bundles carry a stopped TP=2 gate; their
    restored TP=3 checks ran with the engine live and therefore skipped NCCL.
    One passing-gate bundle (20260826-decode-depth-2v3) is void for an unrelated
    token-window defect, and 20260827-decode-2node-failed is void because the
    benchmark produced no samples. The ABSENT
    list includes performance runs, matched A/Bs, and pass/fail quality runs
    that did not commit a gate artifact. PRE-DATES-GATE is exactly the five 2026-08-21
    directories, all of which are also VOID-degraded-fabric.
  baseline_value_coverage: >
    10 rows carry a baseline_value: the 7 VOID-degraded-fabric rows, the 1
    VOID-25-token-window row, and both SUPERSEDED rows. That is every non-CURRENT
    row in the index. CURRENT rows do not need one because their evidence stands
    within the caveats recorded on each row.
  notes: >
    output_tokens_actual is the measured distribution from the committed raw
    data. Where a directory records only a requested max_tokens and no
    per-request completion count, that is stated explicitly rather than
    assumed to have been honoured.
  token_field_semantics: >
    IMPORTANT for anyone re-running the grep. The bench_tp3.py / benchmark_tp3.py
    family writes `output_tokens` as an AGGREGATE per concurrency record
    (max_tokens x concurrency), not a per-request count. So `output_tokens: 4096`
    at concurrency 16 means 16 requests x 256 tokens, NOT one 4096-token request.
    The jsonl harnesses (decode_depth_sweep.py, deepconc.py, soak.py, kvab.py)
    write `completion_tokens` (or `ctok`) as a genuine PER-REQUEST count. Only
    the per-request fields can detect the issue #26 short-window defect; reading
    an aggregate `output_tokens` as if it were per-request will hide it.

