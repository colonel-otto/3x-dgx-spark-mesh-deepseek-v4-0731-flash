      prompt ended "In one sentence, state what this describes", so the model
      emitted one sentence and stopped -- max_tokens is a CEILING, not a
      contract, and nothing in the old harness asserted the floor. The fix is
      in decode_depth_sweep.py @ c3e8e0d: set min_tokens == max_tokens, set
      ignore_eos, and RAISE if completion_tokens != max_tokens. Two further
      cautions. (1) Do NOT apply a 31% correction factor to these numbers on
      paper -- that calibration is one depth on one arm; re-measure instead.
      (2) Do NOT discard the TTFT column: TTFT is measured to the FIRST token
      and is completely independent of how many tokens follow, so the TTFT
      finding (2 nodes 6-15% sooner past ~100K) stands, as do the fabric gate,
      the KV pool readback and the zero-cache-hit assertions. What dies is
      every decode MAGNITUDE, including the published +33.6% at 131K and
      +17.9% at 262K -- the repo's headline case for the third node.
