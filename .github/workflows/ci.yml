name: ci
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall scripts tests
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/*.sh

  # The pre-commit hook FAILS OPEN when no Python interpreter is present
  # (notably on Windows/Git-Bash). This job is the backstop that cannot be
  # skipped: it scans the full tree and the whole history of the push.
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, not just the tip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan tracked files
        run: python scripts/check_no_sensitive.py

      - name: Scan every commit in history
        run: |
          set -euo pipefail
          # A redaction commit does not remove a secret already in history.
          # Fail if any blob in any commit carries an identifier we redact.
          patterns='DGX_SERIAL_NUMBER="[^<][^"]*"|\b192\.168\.1\.[0-9]{1,3}\b|\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b|\b(gx10-[0-9a-f]{4}|spark-[0-9a-f]{4})\b'
          bad=0
          while read -r sha; do
            if git grep -InE "$patterns" "$sha" -- \
                 ':!scripts/check_no_sensitive.py' ':!SECURITY.md' \
                 ':!.github/workflows/ci.yml' 2>/dev/null | head -5 | grep -q .; then
              echo "::error::commit $sha contains a redacted-class identifier"
              git grep -InE "$patterns" "$sha" -- \
                ':!scripts/check_no_sensitive.py' ':!SECURITY.md' \
                ':!.github/workflows/ci.yml' 2>/dev/null | head -5
              bad=1
            fi
          done < <(git rev-list --all)
          if [ "$bad" -ne 0 ]; then
            echo "::error::History contains sensitive data. Rewrite history; a new commit will NOT fix this."
            exit 1
          fi
          echo "History clean across $(git rev-list --all --count) commits."
